# 先打开 CUKTECH Studio Mac App，再在本文件所在目录运行：
# docker compose -f compose.mac.beta.yaml up -d --wait
# 打开 http://127.0.0.1:28753/。请保持 Mac App 运行，由它连接蓝牙。
name: cuktech-studio-mac

services:
  frontend:
    image: ghcr.io/morty626/cuktech-studio-frontend:${CUKTECH_VERSION:-beta}
    pull_policy: always
    ports:
      - "127.0.0.1:${CUKTECH_MAC_FRONTEND_PORT:-28753}:8080"
    environment:
      CUKTECH_PUBLIC_ORIGIN: "http://127.0.0.1:${CUKTECH_MAC_FRONTEND_PORT:-28753}"
      CUKTECH_DEFAULT_BACKEND: "http://host.docker.internal:${CUKTECH_MAC_BACKEND_PORT:-18399}"
    volumes:
      - frontend-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  frontend-data:
